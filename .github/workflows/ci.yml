name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build module and unit tests
        run: docker build -f tests/Dockerfile.unittest -t pam-ldap-totp-auth:test .

      - name: Run unit tests
        run: docker run --rm pam-ldap-totp-auth:test
